name: Regression Test wiki
on:
  gollum:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the page changes without committing them
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: regression-charts
  cancel-in-progress: false

jobs:
  update:
    name: Update tests, releases and charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install matplotlib
        run: pip install matplotlib==3.11.2

      - name: Add new tests and releases
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          python .github/scripts/regression_update.py wiki Regression-Test.md
          ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Generate charts
        run: python .github/scripts/regression_charts.py wiki Regression-Test.md

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        working-directory: wiki
        env:
          MESSAGE: ${{ steps.update.outputs.message || 'Regenerate regression charts' }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MESSAGE"
          git push
